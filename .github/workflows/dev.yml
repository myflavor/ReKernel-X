name: Dev ReKernel-X

# Dev 包：AAR + LKM + Magisk ZIP，只上传 Actions Artifact，不发 Release
on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable RKX_DEBUG (rkx_log_debug)'
        required: true
        type: boolean
        default: true

jobs:
  build-aar:
    name: Build AAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Build AAR
        working-directory: Develop
        run: |
          chmod +x gradlew
          ./gradlew :rekernel_x:assembleRelease

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: rekernel_x-aar
          path: Develop/rekernel_x/build/outputs/aar/rekernel_x-release.aar
          retention-days: 14

  build-lkm:
    name: Build rekernel_x.ko for ${{ matrix.kmi }}-${{ matrix.ddk_release }}
    strategy:
      matrix:
        include:
          - kmi: android12-5.10
            ddk_release: '20260313'
          - kmi: android13-5.10
            ddk_release: '20260313'
          - kmi: android13-5.15
            ddk_release: '20260313'
          - kmi: android14-5.15
            ddk_release: '20260313'
          - kmi: android14-6.1
            ddk_release: '20250825'
          - kmi: android14-6.1
            ddk_release: '20260313'
          - kmi: android15-6.6
            ddk_release: '20260313'
          - kmi: android16-6.12
            ddk_release: '20251104'
          - kmi: android16-6.12
            ddk_release: '20260313'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-${{ matrix.ddk_release }}
      options: --privileged
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build rekernel_x.ko
        run: |

          KMI=${{ matrix.kmi }}

          echo "=== Building rekernel_x.ko for KMI: $KMI ==="

          # Source
          cp -r ./LKM-Source /opt/ddk/src/$KMI/drivers/rekernel_x

          if [ "${{ inputs.debug }}" = "true" ]; then
            echo 'ccflags-y += -DRKX_DEBUG' >> /opt/ddk/src/$KMI/drivers/rekernel_x/Makefile
            echo "=== RKX_DEBUG enabled ==="
          fi

          # Build
          cd /opt/ddk/src/$KMI
          make -C /opt/ddk/kdir/$KMI \
            M=/opt/ddk/src/$KMI/drivers/rekernel_x \
            CC="clang" \
            modules

          echo "=== Build completed ==="

          # Artifact
          mkdir -p /github/workspace/out
          OUTPUT_NAME="rekernel_x-${{ matrix.kmi }}-${{ matrix.ddk_release }}.ko"
          cp /opt/ddk/src/$KMI/drivers/rekernel_x/rekernel_x.ko "/github/workspace/out/$OUTPUT_NAME"
          llvm-strip -d "/github/workspace/out/$OUTPUT_NAME"
          ls -la "/github/workspace/out/$OUTPUT_NAME"

      - name: Upload rekernel_x.ko artifact
        uses: actions/upload-artifact@v7
        with:
          name: rekernel_x-${{ matrix.kmi }}-${{ matrix.ddk_release }}.ko
          path: /github/workspace/out/rekernel_x-${{ matrix.kmi }}-${{ matrix.ddk_release }}.ko

  package:
    name: Package Magisk ZIP
    needs: [build-aar, build-lkm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Download all LKM artifacts
        uses: actions/download-artifact@v4
        with:
          path: kmod-artifacts
          pattern: rekernel_x-*.ko

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: rekernel_x-aar

      - name: Prepare Magisk module
        run: |
          VERSION=dev
          VERSION_CODE=${{ github.run_number }}
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          cp -r template ReKernel-X

          sed -i "s/@VERSION@/${VERSION}-${SHORT_SHA}/g" ReKernel-X/module.prop
          sed -i "s/@VERSION_CODE@/${VERSION_CODE}/g" ReKernel-X/module.prop

          mkdir -p ReKernel-X/kmod
          for dir in kmod-artifacts/rekernel_x-*.ko/; do
            cp "$dir"/*.ko ReKernel-X/kmod/
          done

          echo "=== module.prop ==="
          cat ReKernel-X/module.prop
          echo "=== kmod contents ==="
          ls -lh ReKernel-X/kmod/

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: rekernel_x-dev-lkm
          path: ReKernel-X/
          retention-days: 14

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: rekernel_x-dev-aar
          path: rekernel_x-release.aar
          retention-days: 14
